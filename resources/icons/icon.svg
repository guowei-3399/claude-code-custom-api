<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bolt-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" fill="url(#bg-gradient)"/>

  <!-- Lightning bolt icon (represents speed/power) -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Main bolt shape -->
    <path d="M 0,-140 L -60,-20 L 20,-20 L -20,140 L 80,0 L 0,0 Z"
          fill="url(#bolt-gradient)"
          stroke="#fff"
          stroke-width="8"
          stroke-linejoin="round"/>
  </g>

  <!-- Optional: Add "C" letter for Claude -->
  <g transform="translate(380, 420)" opacity="0.9">
    <circle r="40" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="0"
          font-family="Arial, sans-serif"
          font-size="48"
          font-weight="bold"
          fill="white"
          text-anchor="middle"
          dominant-baseline="central">C</text>
  </g>
</svg>
