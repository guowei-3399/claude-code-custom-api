<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Window Frame -->
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f5f5f5"/>

  <!-- Application Window -->
  <g filter="url(#shadow)">
    <!-- Window -->
    <rect x="50" y="50" width="700" height="400" rx="12" fill="white"/>

    <!-- Title Bar -->
    <rect x="50" y="50" width="700" height="40" rx="12" fill="#667eea"/>
    <circle cx="70" cy="70" r="6" fill="#ff5f56"/>
    <circle cx="90" cy="70" r="6" fill="#ffbd2e"/>
    <circle cx="110" cy="70" r="6" fill="#27c93f"/>
    <text x="380" y="75" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">
      Claude Code Custom API
    </text>

    <!-- Sidebar -->
    <rect x="50" y="90" width="150" height="310" fill="#f8f9fa"/>
    <text x="70" y="120" font-family="Arial" font-size="16" font-weight="bold" fill="#667eea">⚡ Claude</text>

    <!-- Nav Items -->
    <rect x="60" y="140" width="130" height="35" rx="6" fill="#667eea"/>
    <text x="75" y="162" font-family="Arial" font-size="14" fill="white">🏠 Home</text>

    <rect x="60" y="185" width="130" height="35" rx="6" fill="transparent"/>
    <text x="75" y="207" font-family="Arial" font-size="14" fill="#333">⚙️ Settings</text>

    <rect x="60" y="230" width="130" height="35" rx="6" fill="transparent"/>
    <text x="75" y="252" font-family="Arial" font-size="14" fill="#333">ℹ️ About</text>

    <!-- Main Content Area -->
    <g transform="translate(220, 110)">
      <!-- Quick Launch Card -->
      <rect x="0" y="0" width="510" height="260" rx="8" fill="#f8f9fa"/>
      <text x="20" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#667eea">
        Quick Launch
      </text>

      <!-- Info Box -->
      <rect x="20" y="50" width="470" height="60" rx="6" fill="#e8eaf6"/>
      <text x="35" y="72" font-family="Arial" font-size="12" fill="#333">
        Claude Version: 2.1.314
      </text>
      <text x="35" y="90" font-family="Arial" font-size="12" fill="#333">
        API Provider: Anthropic Official
      </text>

      <!-- Input Field -->
      <rect x="20" y="125" width="470" height="40" rx="6" fill="white" stroke="#ddd" stroke-width="2"/>
      <text x="35" y="150" font-family="Arial" font-size="13" fill="#999">
        Your question or command...
      </text>

      <!-- Dropdowns -->
      <rect x="20" y="180" width="220" height="35" rx="6" fill="white" stroke="#ddd" stroke-width="2"/>
      <text x="35" y="203" font-family="Arial" font-size="12" fill="#333">
        Opus 5.5 ▼
      </text>

      <rect x="270" y="180" width="220" height="35" rx="6" fill="white" stroke="#ddd" stroke-width="2"/>
      <text x="285" y="203" font-family="Arial" font-size="12" fill="#333">
        Medium ▼
      </text>

      <!-- Launch Button -->
      <rect x="20" y="230" width="180" height="45" rx="8" fill="#667eea"/>
      <text x="110" y="257" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
        🚀 Launch Claude Code
      </text>
    </g>
  </g>

  <!-- Footer Text -->
  <text x="400" y="480" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">
    Screenshot - Claude Code Custom API Desktop Application
  </text>
</svg>
